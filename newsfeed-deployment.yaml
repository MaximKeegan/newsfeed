apiVersion: apps/v1
kind: Deployment
metadata:
  name: newsfeed-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: newsfeed
  template:
    metadata:
      labels:
        app: newsfeed
    spec:
      containers:
      - name: newsfeed
        image: newsfeed:1.9
        imagePullPolicy: Never # Для локального образа
        ports:
        - containerPort: 8080 # Порт, на котором работает приложение
        env:
          - name: DB_HOST
            value: "postgres-service"
          - name: DB_NAME
            value: "maximkeegan"
          - name: DB_USERNAME
            value: "maximkeegan"
          - name: DB_PASSWORD
            value: "password"
          - name: DB_PORT
            value: "5432"
